configurations {
	compile {
		transitive = false
	}
}

dependencies {
	provided group: "com.liferay", name: "com.liferay.osgi.util", version: "2.0.7"
	provided group: "com.liferay", name: "com.liferay.rtl.css", version: "1.0.4"
	provided group: "com.liferay.portal", name: "portal-impl", version: liferay.portalVersion
	provided group: "com.liferay.portal", name: "portal-service", version: liferay.portalVersion
	provided group: "javax.servlet", name: "javax.servlet-api", version: "3.0.1"
	provided group: "org.apache.felix", name: "org.apache.felix.utils", version: "1.6.0"
	provided group: "org.eclipse.osgi", name: "org.eclipse.osgi.services", version: "3.5.0-20150611.165350-3"
	provided group: "org.osgi", name: "org.osgi.compendium", version: "5.0.0"
	provided group: "org.osgi", name: "org.osgi.core", version: "6.0.0"

	provided project(":core:osgi-service-tracker-collections")
}

liferay {
	deployDir = file("${liferayHome}/osgi/modules")
}