sourceCompatibility = "1.8"
targetCompatibility = "1.8"

dependencies {
	compile group: "biz.aQute.bnd", name: "aQute.libg", version: "3.5.0"
	provided group: "com.liferay", name: "com.liferay.petra.concurrent", version: "1.2.3"
	provided group: "com.liferay", name: "com.liferay.petra.io", version: "1.2.3"
	provided group: "com.liferay", name: "com.liferay.petra.reflect", version: "1.1.2"
	provided group: "com.liferay", name: "com.liferay.petra.string", version: "1.1.1"
	provided group: "com.liferay", name: "com.liferay.petra.lang", version: "1.1.3"
	provided group: "com.liferay", name: "com.liferay.petra.nio", version: "1.0.3"
	provided group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.3.0"
	provided group: "org.osgi", name: "osgi.core", version: "6.0.0"
	provided group: "org.slf4j", name: "slf4j-api", version: "1.7.2"
	provided project(":core:petra:petra-messaging-api")
}

liferay {
	deployDir = appServerLibGlobalDir
}
